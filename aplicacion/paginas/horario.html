<!DOCTYPE html>
<html lang="es">

<head>

    <link rel="stylesheet" href="estilos_generales.css">

    <link rel="stylesheet"

    <style>.auth-pending body{visibility:hidden}</style>

</head>

<body>

<div class="container">

    <aside class="sidebar" data-navegacion-principal></aside>

    <main class="main">

        <header class="header">

            <div>
                <h1>Gestión de Horarios</h1>
                <p>Programación académica de fichas</p>
            </div>

            <button type="button" class="btn" data-action="new-schedule">
                <i class="fas fa-plus"></i>
                Nuevo Horario
            </button>

        </header>
<section class="table-container">

    <h2 style="margin-bottom:20px;">
        Consultar Horario por Ficha

    <div class="form-group">

        <label>Seleccione una ficha</label>

        <select id="ficha">

            <option value="">Seleccione...</option>

            <option value="3349881">3349881</option>
            <option value="3349882">3349882</option>
            <option value="3349884">3349884</option>
            <option value="3349885">3349885</option>
            <option value="3349886">3349886</option>
            <option value="3349887">3349887</option>
            <option value="3349888">3349888</option>
            <option value="3349889">3349889</option>

        </select>

    </div>

    <table>

        <thead>

            <tr>

                <th>Aprendiz</th>
                <th>Zona</th>
                <th>Día</th>
                <th>Instructor</th>
                <th>Hora</th>

            </tr>

        </thead>

        <tbody id="tablaHorarios">

        </tbody>

    </table>

</section>
    </main>

</div>
